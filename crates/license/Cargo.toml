[package]
name = "stacio-license"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "License 授权系统：功能门控 / 设备指纹 / 离线授权导入（规范见 license-integration.md）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# 授权 token 存平台安全存储（Keychain / Credential Manager，规范 §2）。
stacio-platform = { path = "../platform" }
# 离线申请信封：X25519 + HKDF-SHA256 + ChaCha20-Poly1305
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"
# 授权 token 验签：Ed25519
ed25519-dalek = "2"
rand = "0.8"
log = "0.4"
