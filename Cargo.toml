[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/term",
    "crates/platform",
    "crates/core-bridge",
]

# stacio_core 是纯路径依赖，不作为 workspace 成员构建。
# 否则 cargo check --workspace 会按成员用默认 features（含 rdpdr）构建，
# 使 Windows 编译 ironrdp-rdpdr-native 失败（仅 nix backend）。
exclude = ["vendor/stacio_core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Stacio Source Available Non-Commercial License 1.0"
authors = ["Stacio Cross Platform Team"]

[workspace.dependencies]
# --- terminal core ---
alacritty_terminal = "0.26.0"

# --- graphics ---
# 与 egui-wgpu 0.35 对齐（其依赖 wgpu 29）。三端必须同一 wgpu 大版本，类型才互通。
wgpu = "29.0"
ab_glyph = "0.2"

# --- UI (egui + winit) ---
egui = "0.35.0"
egui-winit = "0.35.0"
egui-wgpu = "0.35.0"
winit = "0.30.13"

# --- utility ---
pollster = "0.4"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# stacio_core 依赖的 vendored patch（patch 只在顶层 workspace 生效，须与 StacioCore 同步）。
[patch.crates-io]
ironrdp-tls = { path = "vendor/stacio_core/Vendor/ironrdp-tls" }
