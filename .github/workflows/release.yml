name: 打包安装包

# 在 Windows / Linux 上构建 release + 生成中文安装包，上传为 artifact。
# macOS 也构建 .app（本机已能做，这里 CI 做保证）。
# 触发：push 到 main 或手动 workflow_dispatch。

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: 编译 release
        run: cargo build --release --target x86_64-pc-windows-msvc -p stacio-app
      - name: 生成 ico
        shell: bash
        run: |
          choco install imagemagick -y --no-progress 2>/dev/null || true
          magick assets/icons/stacio-256.png packaging/windows/stacio.ico || true
      - name: NSIS 中文安装包
        shell: bash
        run: |
          choco install nsis -y --no-progress 2>/dev/null || true
          chmod +x scripts/build-installer.sh
          ./scripts/build-installer.sh windows || true
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Stacio-windows-installer
          path: |
            packaging/windows/StacioSetup-*.exe
            target/x86_64-pc-windows-msvc/release/stacio-app.exe

  linux:
    name: Linux 安装包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: 安装系统依赖（GUI 运行时库）
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config dpkg-dev
      - name: 编译 release
        run: cargo build --release --target x86_64-unknown-linux-gnu -p stacio-app
      - name: 生成 .deb 中文安装包
        run: |
          chmod +x scripts/build-installer.sh
          ./scripts/build-installer.sh linux
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Stacio-linux-installer
          path: |
            packaging/linux/stacio_*.deb
            target/x86_64-unknown-linux-gnu/release/stacio-app

  macos:
    name: macOS 应用
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 编译 release + 组装 .app
        run: |
          cargo build --release -p stacio-app
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh
      - name: 压缩为 zip
        run: |
          cd dist
          ditto -c -k --keepParent Stacio.app Stacio-macos.zip
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Stacio-macos-app
          path: dist/Stacio-macos.zip
